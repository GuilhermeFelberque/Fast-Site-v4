spring.application.name=turbo-garage

# ===== BANCO DE DADOS (MySQL) =====
# Driver antigo mysql-connector-java 5.1.49 (o mesmo do projeto original)
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
# createDatabaseIfNotExist=true -> cria o banco login_db sozinho se ele não existir
spring.datasource.url=jdbc:mysql://localhost:3306/login_db?createDatabaseIfNotExist=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8
# Usuário e senha DO MYSQL (troque pela senha real do seu MySQL!)
spring.datasource.username=root
spring.datasource.password=

# ===== CRIAÇÃO DAS TABELAS =====
# Executa src/main/resources/schema.sql toda vez que o servidor liga
# (usa CREATE TABLE IF NOT EXISTS, então não apaga nada)
spring.sql.init.mode=always

# ===== SESSÃO DE LOGIN =====
server.servlet.session.timeout=30m

# ===== ADMINISTRADOR (único que vê os "Cadastros salvos") =====
# Coloque aqui o SEU gmail. Ao ligar o servidor:
#  - se esse email ainda não existe, ele é criado com a senha abaixo (em BCrypt)
#  - se você já tinha se cadastrado com ele, ele vira ADMIN e mantém a sua senha
app.admin.email=admin@email.com
app.admin.senha=minhaSenha123
