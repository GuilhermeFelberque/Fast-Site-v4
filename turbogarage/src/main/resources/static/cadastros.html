<!DOCTYPE html>
<!-- TELA 3: CADASTROS SALVOS (consulta) - SÓ O ADMINISTRADOR ACESSA -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Turbo Garage | Cadastros salvos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="oculto">
    <header class="topo">
        <a class="marca" href="/home.html">
            <div class="marca-logo">TG</div>
            <div>
                <div class="marca-nome">TURBO <span>GARAGE</span></div>
                <div class="marca-slogan">Gestão de clientes para oficina mecânica</div>
            </div>
        </a>
        <div class="topo-direita">
            <nav>
                <a href="/home.html">Início</a>
                <a href="/cadastros.html" class="ativo">Clientes</a>
                <a href="/veiculos.html">Veículos</a>
                <a href="/ordens.html">Ordens de Serviço</a>
            </nav>
            <div class="aluno">Aluno: <strong>Guilherme Felberque/Danilo Dorella</strong></div>
            <button id="btnSair" class="btn btn-escuro btn-pequeno">Sair</button>
        </div>
    </header>

    <main class="conteudo">
        <h1 class="titulo-pagina"><span>Cadastros</span> salvos</h1>

        <div class="grade">
            <!-- ===== LISTA ===== -->
            <section class="cartao">
                <h2>Clientes</h2>
                <form class="busca" id="formBusca">
                    <input id="buscaId" type="number" min="1" placeholder="Buscar ID">
                    <button class="btn btn-pequeno" type="submit">Buscar</button>
                </form>
                <div class="tabela-rolagem">
                    <table>
                        <thead>
                            <tr><th>ID</th><th>Nome</th><th></th></tr>
                        </thead>
                        <tbody id="lista"></tbody>
                    </table>
                </div>
                <div id="msgLista" class="alerta" role="alert"></div>
                <p class="link-conta"><a href="/cadastro.html">+ Novo cadastro</a></p>
            </section>

            <!-- ===== FICHA (GET /api/cadastros/{id}) ===== -->
            <section class="cartao">
                <h2 id="detalheTitulo">Ficha do cliente</h2>
                <p class="vazio" id="detalheVazio">Clique em "Ver" para abrir a ficha de um cliente.</p>
                <div class="detalhe" id="detalhe">
                    <dl id="detalheDados"></dl>
                </div>
            </section>
        </div>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script src="/js/sessao.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        let selecionado = null;

        function alerta(texto, tipo) {
            const el = $("msgLista");
            el.textContent = texto;
            el.className = "alerta " + (tipo || "");
        }
        function toast(texto) {
            const t = $("toast");
            t.textContent = texto;
            t.classList.add("mostrar");
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove("mostrar"), 3500);
        }

        // 401 = sessão expirou -> login; 403 = não é admin -> início
        async function api(url, opcoes) {
            const r = await fetch(url, opcoes);
            if (r.status === 401) { window.location.href = "/index.html"; throw new Error("redirecionado"); }
            if (r.status === 403) { window.location.href = "/home.html"; throw new Error("redirecionado"); }
            const dados = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(dados.mensagem || "Erro " + r.status);
            return dados;
        }

        // ---------- GET /api/cadastros ----------
        async function carregarLista() {
            try {
                const lista = await api("/api/cadastros");
                const tbody = $("lista");
                tbody.innerHTML = "";
                if (lista.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="vazio">Nenhum cadastro ainda.</td></tr>';
                    return;
                }
                for (const c of lista) {
                    const tr = document.createElement("tr");
                    tr.dataset.id = c.id;
                    if (c.id === selecionado) tr.className = "selecionado";
                    tr.innerHTML = `<td></td><td></td>
                        <td class="acoes">
                            <button class="btn btn-pequeno" data-ver>Ver</button>
                            <button class="btn btn-pequeno btn-perigo" data-excluir>Excluir</button>
                        </td>`;
                    tr.children[0].textContent = "#" + c.id;   // textContent evita injeção de HTML
                    tr.children[1].textContent = c.nome;
                    tr.querySelector("[data-ver]").onclick = () => mostrarDetalhe(c.id);
                    tr.querySelector("[data-excluir]").onclick = e => pedirConfirmacao(e.target, c);
                    tbody.appendChild(tr);
                }
            } catch (err) {
                if (err.message !== "redirecionado") alerta(err.message, "erro");
            }
        }

        // ---------- GET /api/cadastros/{id} ----------
        async function mostrarDetalhe(id) {
            try {
                const c = await api("/api/cadastros/" + id);
                selecionado = c.id;
                alerta("");
                $("detalheTitulo").textContent = "Ficha do cliente #" + c.id;
                const linhas = [
                    ["Nome", c.nome], ["Email", c.email], ["Endereço", c.endereco], ["Número", c.numero],
                    ["CEP", c.cep], ["Telefone", c.telefone], ["Observação", c.observacao],
                    ["Criado em", c.dataCriacao]
                ];
                const dl = $("detalheDados");
                dl.innerHTML = "";
                for (const [rotulo, valor] of linhas) {
                    const dt = document.createElement("dt"); dt.textContent = rotulo;
                    const dd = document.createElement("dd"); dd.textContent = valor || "—";
                    dl.append(dt, dd);
                }
                $("detalhe").classList.add("visivel");
                $("detalheVazio").hidden = true;
                document.querySelectorAll("#lista tr").forEach(tr =>
                    tr.classList.toggle("selecionado", tr.dataset.id === String(c.id)));
            } catch (err) {
                if (err.message !== "redirecionado") alerta(err.message, "erro");
            }
        }

        $("formBusca").addEventListener("submit", e => {
            e.preventDefault();
            const id = $("buscaId").value;
            if (id) mostrarDetalhe(id);
        });

        // ---------- DELETE /api/cadastros/{id} (desafio 3) ----------
        // 1º clique pede confirmação, 2º clique exclui
        function pedirConfirmacao(botao, c) {
            if (botao.dataset.confirmar) { excluir(c); return; }
            botao.dataset.confirmar = "1";
            botao.textContent = "Confirmar?";
            setTimeout(() => { delete botao.dataset.confirmar; botao.textContent = "Excluir"; }, 3000);
        }
        async function excluir(c) {
            try {
                await api("/api/cadastros/" + c.id, { method: "DELETE" });
                toast(`Cadastro #${c.id} (${c.nome}) excluído`);
                if (selecionado === c.id) {
                    $("detalhe").classList.remove("visivel");
                    $("detalheVazio").hidden = false;
                    $("detalheTitulo").textContent = "Ficha do cliente";
                    selecionado = null;
                }
                await carregarLista();
            } catch (err) {
                if (err.message !== "redirecionado") alerta(err.message, "erro");
            }
        }

        ligarBotaoSair();
        exigirAdmin().then(u => { if (u) carregarLista(); });
    </script>
</body>
</html>
