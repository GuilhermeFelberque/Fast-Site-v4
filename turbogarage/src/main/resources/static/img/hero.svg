<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Fundo: oficina em flat design, preto + amarelo -->
  <rect width="1920" height="1080" fill="#0b0b0b"/>

  <!-- Raios de fundo -->
  <g fill="#ffd400" opacity="0.13">
    <polygon points="1300,560 1920,0 1920,180"/>
    <polygon points="1300,560 1920,330 1920,520"/>
    <polygon points="1300,560 1920,700 1920,900"/>
    <polygon points="1300,560 1500,0 1720,0"/>
    <polygon points="1300,560 900,0 1120,0"/>
    <polygon points="1300,560 400,0 620,0"/>
    <polygon points="1300,560 0,120 0,330"/>
  </g>

  <!-- Portão da garagem -->
  <rect x="760" y="140" width="1080" height="640" fill="#1c1c1c"/>
  <g fill="#262626">
    <rect x="760" y="180" width="1080" height="34"/>
    <rect x="760" y="260" width="1080" height="34"/>
    <rect x="760" y="340" width="1080" height="34"/>
    <rect x="760" y="420" width="1080" height="34"/>
    <rect x="760" y="500" width="1080" height="34"/>
    <rect x="760" y="580" width="1080" height="34"/>
    <rect x="760" y="660" width="1080" height="34"/>
    <rect x="760" y="740" width="1080" height="34"/>
  </g>
  <rect x="740" y="110" width="1120" height="40" fill="#ffd400"/>
  <text x="1300" y="140" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#0b0b0b" text-anchor="middle" letter-spacing="10">TURBO GARAGE • OFICINA</text>

  <!-- Faixa zebrada de segurança -->
  <defs>
    <pattern id="zebra" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="40" height="80" fill="#ffd400"/>
      <rect x="40" width="40" height="80" fill="#0b0b0b"/>
    </pattern>
    <pattern id="xadrez" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#ffffff"/>
      <rect width="20" height="20" fill="#0b0b0b"/>
      <rect x="20" y="20" width="20" height="20" fill="#0b0b0b"/>
    </pattern>
  </defs>
  <rect x="0" y="900" width="1920" height="180" fill="#ffd400"/>
  <rect x="0" y="880" width="1920" height="40" fill="url(#zebra)"/>

  <!-- Chão -->
  <rect x="0" y="780" width="1920" height="100" fill="#151515"/>

  <!-- Carro esportivo (perfil) -->
  <g transform="translate(860 440)">
    <!-- sombra -->
    <ellipse cx="460" cy="360" rx="470" ry="26" fill="#000"/>
    <!-- carroceria -->
    <path d="M30 300 L40 220 Q60 190 140 180 L300 160 Q380 80 470 70 L640 70 Q720 74 790 160 L880 180 Q930 190 935 240 L940 300 Z" fill="#ffd400"/>
    <!-- vidros -->
    <path d="M330 162 Q395 98 470 92 L545 92 L545 162 Z" fill="#0b0b0b"/>
    <path d="M565 92 L635 92 Q700 98 760 162 L565 162 Z" fill="#0b0b0b"/>
    <!-- faixa racing -->
    <rect x="40" y="236" width="895" height="20" fill="#0b0b0b"/>
    <!-- número -->
    <circle cx="470" cy="215" r="0" fill="#fff"/>
    <!-- farol / lanterna -->
    <rect x="905" y="200" width="30" height="18" fill="#ffffff"/>
    <rect x="40" y="206" width="22" height="16" fill="#e10600"/>
    <!-- rodas -->
    <g>
      <circle cx="220" cy="300" r="78" fill="#0b0b0b"/>
      <circle cx="220" cy="300" r="42" fill="#ffffff"/>
      <circle cx="220" cy="300" r="14" fill="#0b0b0b"/>
      <circle cx="730" cy="300" r="78" fill="#0b0b0b"/>
      <circle cx="730" cy="300" r="42" fill="#ffffff"/>
      <circle cx="730" cy="300" r="14" fill="#0b0b0b"/>
    </g>
    <!-- linhas de velocidade -->
    <g fill="#ffd400">
      <rect x="-160" y="120" width="140" height="12"/>
      <rect x="-220" y="170" width="200" height="12"/>
      <rect x="-130" y="220" width="110" height="12"/>
    </g>
  </g>

  <!-- Chave inglesa gigante -->
  <g transform="translate(1680 230) rotate(35)" fill="#ffffff">
    <rect x="-22" y="0" width="44" height="300" rx="6"/>
    <path d="M-70 -40 A75 75 0 1 0 70 -40 L30 -40 L30 10 L-30 10 L-30 -40 Z"/>
  </g>

  <!-- Bandeira quadriculada -->
  <rect x="80" y="80" width="240" height="120" fill="url(#xadrez)"/>
  <rect x="64" y="70" width="16" height="320" fill="#ffffff"/>
</svg>
