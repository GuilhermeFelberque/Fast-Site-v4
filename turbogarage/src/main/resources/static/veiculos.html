<!DOCTYPE html>
<!-- PARTE 4 - NOVA TELA 1: CRUD DE VEÍCULOS (só o administrador acessa) -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Turbo Garage | Veículos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="oculto">
    <header class="topo">
        <a class="marca" href="/home.html">
            <div class="marca-logo">TG</div>
            <div>
                <div class="marca-nome">TURBO <span>GARAGE</span></div>
                <div class="marca-slogan">Gestão de clientes para oficina mecânica</div>
            </div>
        </a>
        <div class="topo-direita">
            <nav>
                <a href="/home.html">Início</a>
                <a href="/cadastros.html">Clientes</a>
                <a href="/veiculos.html" class="ativo">Veículos</a>
                <a href="/ordens.html">Ordens de Serviço</a>
            </nav>
            <div class="aluno">Aluno: <strong>Guilherme Felberque/Danilo Dorella</strong></div>
            <button id="btnSair" class="btn btn-escuro btn-pequeno">Sair</button>
        </div>
    </header>

    <main class="conteudo">
        <h1 class="titulo-pagina"><span>Veículos</span> da oficina</h1>

        <div class="grade">
            <!-- ===== CREATE / UPDATE ===== -->
            <section class="cartao" id="cartaoForm">
                <h2 id="tituloForm">Novo veículo</h2>
                <form id="formVeiculo" novalidate>
                    <div class="campo">
                        <label for="placa">Placa *</label>
                        <input id="placa" maxlength="8" placeholder="ABC-1234 ou ABC1D23" autocomplete="off" required>
                    </div>
                    <div class="campo">
                        <label for="modelo">Modelo *</label>
                        <input id="modelo" maxlength="100" placeholder="Ex.: VW Gol 1.6" required>
                    </div>
                    <div class="campo">
                        <label for="ano">Ano *</label>
                        <input id="ano" type="number" min="1950" max="2100" placeholder="Ex.: 2018" required>
                    </div>
                    <div class="campo">
                        <label for="clienteId">Cliente (dono) *</label>
                        <select id="clienteId" required>
                            <option value="">Carregando clientes...</option>
                        </select>
                        <div class="dica">O veículo fica ligado ao cadastro do cliente.</div>
                    </div>
                    <div class="form-botoes">
                        <button type="submit" class="btn" id="btnSalvar">Salvar</button>
                        <button type="button" class="btn btn-claro" id="btnCancelar" hidden>Cancelar edição</button>
                    </div>
                </form>
                <div id="msgForm" class="alerta" role="alert"></div>
            </section>

            <!-- ===== READ / DELETE ===== -->
            <section class="cartao">
                <h2>Veículos cadastrados</h2>
                <div class="barra-lista">
                    <input id="filtro" type="search" placeholder="Buscar por placa, modelo, ano ou cliente">
                    <button class="btn btn-pequeno" id="btnExportar" type="button">Exportar Excel</button>
                </div>
                <div class="total" id="total"></div>
                <div class="tabela-rolagem">
                    <table>
                        <thead>
                            <tr><th>ID</th><th>Placa</th><th>Modelo</th><th>Ano</th><th>Cliente</th><th></th></tr>
                        </thead>
                        <tbody id="lista"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script src="/js/sessao.js"></script>
    <script src="/js/comum.js"></script>
    <script>
        let veiculos = [];
        let editandoId = null;   // null = criando; número = editando

        // Placa: letras maiúsculas
        $("placa").addEventListener("input", e => {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, "");
        });

        // ---------- Clientes para o <select> (GET /api/cadastros) ----------
        async function carregarClientes() {
            const clientes = await api("/api/cadastros");
            const sel = $("clienteId");
            sel.innerHTML = '<option value="">Selecione o cliente</option>';
            for (const c of clientes) {
                const op = document.createElement("option");
                op.value = c.id;
                op.textContent = `#${c.id} - ${c.nome}`;
                sel.appendChild(op);
            }
            if (clientes.length === 0) {
                sel.innerHTML = '<option value="">Nenhum cliente cadastrado ainda</option>';
            }
        }

        // ---------- READ: GET /api/veiculos ----------
        async function carregar() {
            try {
                veiculos = await api("/api/veiculos");
                desenhar();
            } catch (err) {
                if (err.message !== "redirecionado") toast(err.message, "erro");
            }
        }

        function filtrados() {
            const termo = normalizar($("filtro").value);
            return veiculos.filter(v =>
                normalizar(`${v.placa} ${v.modelo} ${v.ano} ${v.clienteNome}`).includes(termo));
        }

        function desenhar() {
            const lista = filtrados();
            const tbody = $("lista");
            tbody.innerHTML = "";
            $("total").textContent = `${lista.length} de ${veiculos.length} veículo(s)`;
            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="vazio">${veiculos.length ? "Nenhum veículo encontrado na busca." : "Nenhum veículo cadastrado ainda."}</td></tr>`;
                return;
            }
            for (const v of lista) {
                const tr = document.createElement("tr");
                if (v.id === editandoId) tr.className = "selecionado";
                tr.innerHTML = `<td></td><td class="placa"></td><td></td><td></td><td></td>
                    <td class="acoes">
                        <button class="btn btn-pequeno" data-editar>Editar</button>
                        <button class="btn btn-pequeno btn-perigo" data-excluir>Excluir</button>
                    </td>`;
                const celulas = tr.children;   // textContent evita injeção de HTML
                celulas[0].textContent = "#" + v.id;
                celulas[1].textContent = v.placa;
                celulas[2].textContent = v.modelo;
                celulas[3].textContent = v.ano;
                celulas[4].textContent = v.clienteNome || "—";
                tr.querySelector("[data-editar]").onclick = () => editar(v.id);
                tr.querySelector("[data-excluir]").onclick = () => excluir(v);
                tbody.appendChild(tr);
            }
        }
        $("filtro").addEventListener("input", desenhar);

        // ---------- UPDATE (passo 1): GET /api/veiculos/{id} carrega no formulário ----------
        async function editar(id) {
            try {
                const v = await api("/api/veiculos/" + id);
                editandoId = v.id;
                $("placa").value = v.placa;
                $("modelo").value = v.modelo;
                $("ano").value = v.ano;
                $("clienteId").value = v.clienteId;
                $("tituloForm").innerHTML = 'Editar veículo <span class="modo"></span>';
                $("tituloForm").querySelector(".modo").textContent = "#" + v.id;
                $("btnSalvar").textContent = "Salvar alterações";
                $("btnCancelar").hidden = false;
                $("cartaoForm").classList.add("form-editando");
                erroForm("");
                desenhar();
                $("placa").focus();
                $("cartaoForm").scrollIntoView({ behavior: "smooth", block: "start" });
            } catch (err) {
                if (err.message !== "redirecionado") toast(err.message, "erro");
            }
        }

        function limparFormulario() {
            editandoId = null;
            $("formVeiculo").reset();
            $("tituloForm").textContent = "Novo veículo";
            $("btnSalvar").textContent = "Salvar";
            $("btnCancelar").hidden = true;
            $("cartaoForm").classList.remove("form-editando");
            erroForm("");
            desenhar();
        }
        $("btnCancelar").onclick = limparFormulario;

        // ---------- CREATE (POST) e UPDATE (PUT) ----------
        $("formVeiculo").addEventListener("submit", async e => {
            e.preventDefault();
            const dados = {
                placa: $("placa").value.trim(),
                modelo: $("modelo").value.trim(),
                ano: $("ano").value ? Number($("ano").value) : null,
                clienteId: $("clienteId").value ? Number($("clienteId").value) : null
            };

            // Validação dos campos obrigatórios na tela
            if (!dados.placa) { erroForm("Informe a placa."); $("placa").focus(); return; }
            if (!/^[A-Z]{3}-?[0-9][A-Z0-9][0-9]{2}$/.test(dados.placa)) { erroForm("Placa inválida. Use ABC-1234 ou ABC1D23."); $("placa").focus(); return; }
            if (!dados.modelo) { erroForm("Informe o modelo."); $("modelo").focus(); return; }
            if (!dados.ano || dados.ano < 1950 || dados.ano > 2100) { erroForm("Informe um ano válido."); $("ano").focus(); return; }
            if (!dados.clienteId) { erroForm("Escolha o cliente dono do veículo."); $("clienteId").focus(); return; }

            try {
                const resp = editandoId
                    ? await api("/api/veiculos/" + editandoId, { method: "PUT", body: dados })
                    : await api("/api/veiculos", { method: "POST", body: dados });
                toast(resp.mensagem);   // "Registro salvo com sucesso!" ou "Registro atualizado"
                limparFormulario();
                await carregar();
            } catch (err) {
                if (err.message !== "redirecionado") erroForm(err.message);
            }
        });

        // ---------- DELETE com confirmação ----------
        async function excluir(v) {
            const ok = await confirmar("Excluir veículo?",
                `O veículo ${v.placa} (${v.modelo}) será removido definitivamente do banco de dados.`);
            if (!ok) return;
            try {
                const resp = await api("/api/veiculos/" + v.id, { method: "DELETE" });
                toast(resp.mensagem);   // "Registro excluído"
                if (editandoId === v.id) limparFormulario();
                await carregar();
            } catch (err) {
                if (err.message !== "redirecionado") toast(err.message, "erro");
            }
        }

        // ---------- Desafio 2: exportar ----------
        $("btnExportar").onclick = () => exportarCSV("veiculos.csv",
            ["ID", "Placa", "Modelo", "Ano", "Cliente"],
            filtrados().map(v => [v.id, v.placa, v.modelo, v.ano, v.clienteNome]));

        ligarBotaoSair();
        exigirAdmin().then(u => { if (u) { carregarClientes(); carregar(); } });
    </script>
</body>
</html>
